name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capglyph-cli
    steps:
      # CapGlyph depends on vectomancy crates + capglyph-core via path deps
      # (../vectomancy, ../capglyph-core). Both siblings are checked out side
      # by side under the runner workspace; checkout@v7 rejects paths outside
      # the primary repository dir, so the primary checkout itself lands in a
      # subdirectory.
      - uses: actions/checkout@v7
        with:
          path: capglyph-cli
      - uses: actions/checkout@v7
        with:
          repository: Xuepoo/vectomancy
          path: vectomancy
      - uses: actions/checkout@v7
        with:
          repository: CapGlyph/capglyph-core
          path: capglyph-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # actions/cache@v6 runs on the Node24 runtime (v4 still declared
      # `using: node20`, which the runner force-runs on Node24 with a
      # deprecation warning ahead of the 2026 default switch).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            capglyph-cli/target
            capglyph-core/target
            vectomancy/target
          key: cargo-${{ runner.os }}-${{ hashFiles('capglyph-cli/Cargo.lock', 'capglyph-core/Cargo.lock', 'vectomancy/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (learned+c2pa features)
        run: cargo clippy --features learned,c2pa --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test

      - name: Test (learned+c2pa features)
        run: cargo test --features learned,c2pa

      - name: Lint GitHub Actions (actionlint)
        # Binary download instead of the docker action: the docker variant
        # mounts the repo without the checkout's safe.directory git config,
        # so actionlint reports "no project was found". The plain binary
        # runs in the job context where git works.
        run: |
          curl -sL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color .github/workflows/*.yml

  test-learned-systems:
    name: Test learned on macOS & Windows
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: capglyph-cli
    steps:
      - uses: actions/checkout@v7
        with:
          path: capglyph-cli
      - uses: actions/checkout@v7
        with:
          repository: Xuepoo/vectomancy
          path: vectomancy
      - uses: actions/checkout@v7
        with:
          repository: CapGlyph/capglyph-core
          path: capglyph-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            capglyph-cli/target
            capglyph-core/target
            vectomancy/target
          key: cargo-${{ runner.os }}-${{ hashFiles('capglyph-cli/Cargo.lock', 'capglyph-core/Cargo.lock', 'vectomancy/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test (learned+c2pa features)
        run: cargo test --features learned,c2pa

  wasm-check:
    name: wasm32 check (lib)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capglyph-cli
    steps:
      - uses: actions/checkout@v7
        with:
          path: capglyph-cli
      - uses: actions/checkout@v7
        with:
          repository: Xuepoo/vectomancy
          path: vectomancy
      - uses: actions/checkout@v7
        with:
          repository: CapGlyph/capglyph-core
          path: capglyph-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            capglyph-cli/target
            capglyph-core/target
            vectomancy/target
          key: cargo-${{ runner.os }}-${{ hashFiles('capglyph-cli/Cargo.lock', 'capglyph-core/Cargo.lock', 'vectomancy/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check lib compiles for wasm32
        env:
          RUSTFLAGS: "-C target-cpu=generic"
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features
