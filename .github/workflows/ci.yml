name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sigil
    steps:
      # Sigil depends on the vectomancy crates via path deps (../vectomancy).
      # Both repos are checked out side by side under the runner workspace;
      # checkout@v7 rejects paths outside the primary repository dir, so the
      # primary checkout itself lands in a subdirectory.
      - uses: actions/checkout@v7
        with:
          path: sigil
      - uses: actions/checkout@v7
        with:
          repository: Xuepoo/vectomancy
          path: vectomancy

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # actions/cache@v6 runs on the Node24 runtime (v4 still declared
      # `using: node20`, which the runner force-runs on Node24 with a
      # deprecation warning ahead of the 2026 default switch).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sigil/target
            vectomancy/target
          key: cargo-${{ runner.os }}-${{ hashFiles('sigil/Cargo.lock', 'vectomancy/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (learned feature)
        run: cargo clippy --features learned --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test

      - name: Test (learned feature)
        run: cargo test --features learned

      - name: Lint GitHub Actions (actionlint)
        # Binary download instead of the docker action: the docker variant
        # mounts the repo without the checkout's safe.directory git config,
        # so actionlint reports "no project was found". The plain binary
        # runs in the job context where git works.
        run: |
          curl -sL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color .github/workflows/*.yml

  test-learned-systems:
    name: Test learned on macOS & Windows
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sigil
    steps:
      - uses: actions/checkout@v7
        with:
          path: sigil
      - uses: actions/checkout@v7
        with:
          repository: Xuepoo/vectomancy
          path: vectomancy
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sigil/target
            vectomancy/target
          key: cargo-${{ runner.os }}-${{ hashFiles('sigil/Cargo.lock', 'vectomancy/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test (learned feature)
        run: cargo test --features learned
