name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build Binary for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sigil
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sigil-linux-x86_64
            arch: amd64
            os_name: linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: sigil-linux-aarch64
            arch: arm64
            os_name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sigil-windows-x86_64.exe
            os_name: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: sigil-macos-x86_64
            os_name: macos
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: sigil-macos-aarch64
            os_name: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          path: sigil

      # Sigil depends on the vectomancy crates via path deps (../vectomancy).
      - name: Checkout vectomancy (path dependency)
        uses: actions/checkout@v7.0.1
        with:
          repository: Xuepoo/vectomancy
          path: vectomancy

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sigil/target
            vectomancy/target
          key: release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('sigil/Cargo.lock', 'vectomancy/Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-${{ matrix.target }}-

      - name: Build release (learned feature)
        run: cargo build --release --features learned --target ${{ matrix.target }}

      - name: Rename artifact (Linux/macOS)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: mv "target/${{ matrix.target }}/release/sigil" "${{ matrix.artifact_name }}"

      - name: Rename artifact (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        run: move "target/${{ matrix.target }}/release/sigil.exe" "${{ matrix.artifact_name }}"

      - name: Package tarball (Linux/macOS)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

      - name: Package zip (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        run: powershell Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Package for Linux distributions (nfpm)
        if: matrix.os_name == 'linux'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            NFPM_ARCH="arm64"
            PKG_ARCH="aarch64"
          else
            NFPM_ARCH="x86_64"
            PKG_ARCH="x86_64"
          fi
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.37.1/nfpm_2.37.1_Linux_${NFPM_ARCH}.tar.gz | tar xz nfpm
          sed -i "s/amd64/${NFPM_ARCH}/g" nfpm.yaml
          sed -i "s/sigil-linux-x86_64/${{ matrix.artifact_name }}/g" nfpm.yaml
          ./nfpm pkg --packager deb --target sigil-linux-${PKG_ARCH}.deb
          ./nfpm pkg --packager rpm --target sigil-linux-${PKG_ARCH}.rpm
          ./nfpm pkg --packager archlinux --target sigil-linux-${PKG_ARCH}.pkg.tar.zst

      - name: Upload artifact
        # v5 runs on the Node24 runtime; v4.x still declares node20 and
        # triggers the deprecation warning.
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            sigil/${{ matrix.artifact_name }}.tar.gz
            sigil/${{ matrix.artifact_name }}.zip
            sigil/*.deb
            sigil/*.rpm
            sigil/*.pkg.tar.zst

  release-github:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-aur:
    name: Publish to AUR
    needs: release-github
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm git openssh pacman-contrib sudo fakeroot binutils make gcc pkgconf

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          mkdir -p /root/.ssh
          cp -r ~/.ssh/* /root/.ssh/
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/*

      - name: Configure Git
        run: |
          git config --system --add safe.directory '*'
          git config --global user.name "Xuepoo (CI)"
          git config --global user.email "xuepoofoter@gmail.com"

      - name: Update AUR source package (sigil-wm)
        run: |
          git clone ssh://aur@aur.archlinux.org/sigil-wm.git aur-src
          cd aur-src
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}

          # Bootstrap the PKGBUILD if the AUR repo is still empty (first
          # release). Later runs only bump the version.
          if [ ! -f PKGBUILD ]; then
            cat << PKGEOF > PKGBUILD
          # Maintainer: Xuepoo (CI) <xuepoofoter@gmail.com>
          pkgname=sigil-wm
          pkgver=${CLEAN_VERSION}
          pkgrel=1
          pkgdesc="Invisible structural watermark for images"
          arch=('x86_64' 'aarch64')
          url="https://github.com/Xuepoo/sigil"
          license=('Apache-2.0')
          source=("sigil-\$pkgver::https://github.com/Xuepoo/sigil/archive/refs/tags/v\$pkgver.tar.gz")
          sha256sums=('SKIP')
          makedepends=('cargo')

          build() {
            cd "sigil-\$pkgver"
            cargo build --release --locked --features learned
          }

          package() {
            cd "sigil-\$pkgver"
            install -Dm755 "target/release/sigil" "\$pkgdir/usr/bin/sigil"
          }
          PKGEOF
          else
            sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push origin master

      - name: Update AUR binary package (sigil-wm-bin)
        run: |
          git clone ssh://aur@aur.archlinux.org/sigil-wm-bin.git aur-bin
          cd aur-bin
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}

          if [ ! -f PKGBUILD ]; then
            cat << PKGEOF > PKGBUILD
          # Maintainer: Xuepoo (CI) <xuepoofoter@gmail.com>
          pkgname=sigil-wm-bin
          pkgver=${CLEAN_VERSION}
          pkgrel=1
          pkgdesc="Invisible structural watermark for images (binary release)"
          arch=('x86_64' 'aarch64')
          url="https://github.com/Xuepoo/sigil"
          license=('Apache-2.0')
          _arch="x86_64"
          [ "\$CARCH" = "aarch64" ] && _arch="aarch64"
          source=("sigil-\$pkgver::https://github.com/Xuepoo/sigil/releases/download/v\$pkgver/sigil-linux-\${_arch}.tar.gz")
          sha256sums=('SKIP')

          package() {
            install -Dm755 "sigil" "\$pkgdir/usr/bin/sigil"
          }
          PKGEOF
          else
            sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push origin master

  sync-brew:
    name: Sync Brew Formula
    needs: release-github
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v7.0.1
        with:
          repository: Xuepoo/homebrew-tap
          token: ${{ secrets.GH_PAT }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${VERSION#v}
          curl -sL -O "https://github.com/Xuepoo/sigil/releases/download/${VERSION}/sigil-macos-x86_64.tar.gz"
          curl -sL -O "https://github.com/Xuepoo/sigil/releases/download/${VERSION}/sigil-macos-aarch64.tar.gz"
          SHA_INTEL=$(sha256sum sigil-macos-x86_64.tar.gz | awk '{print $1}')
          SHA_ARM=$(sha256sum sigil-macos-aarch64.tar.gz | awk '{print $1}')

          mkdir -p homebrew-tap/Formula
          cat << EOF > homebrew-tap/Formula/sigil.rb
          class Sigil < Formula
            desc "Invisible structural watermark for images"
            homepage "https://github.com/Xuepoo/sigil"
            version "${CLEAN_VERSION}"
            license "Apache-2.0"

            if OS.mac? && Hardware::CPU.intel?
              url "https://github.com/Xuepoo/sigil/releases/download/${VERSION}/sigil-macos-x86_64.tar.gz"
              sha256 "${SHA_INTEL}"
            elsif OS.mac? && Hardware::CPU.arm?
              url "https://github.com/Xuepoo/sigil/releases/download/${VERSION}/sigil-macos-aarch64.tar.gz"
              sha256 "${SHA_ARM}"
            end

            def install
              bin.install "sigil"
            end

            test do
              system "#{bin}/sigil", "--version"
            end
          end
          EOF

          cd homebrew-tap
          git config user.name "Xuepoo (CI)"
          git config user.email "xuepoofoter@gmail.com"
          git add Formula/sigil.rb
          git commit -m "Update Sigil to ${CLEAN_VERSION}" || true
          git push origin main

  sync-scoop:
    name: Sync Scoop Manifest
    needs: release-github
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout scoop repository
        uses: actions/checkout@v7.0.1
        with:
          repository: Xuepoo/scoop-bucket
          token: ${{ secrets.GH_PAT }}
          path: scoop-bucket

      - name: Update Manifest
        run: |
          VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${VERSION#v}
          curl -sL -O "https://github.com/Xuepoo/sigil/releases/download/${VERSION}/sigil-windows-x86_64.exe.zip"
          SHA_WIN=$(sha256sum sigil-windows-x86_64.exe.zip | awk '{print $1}')

          mkdir -p scoop-bucket/bucket
          cat << EOF > scoop-bucket/bucket/sigil.json
          {
            "version": "${CLEAN_VERSION}",
            "description": "Invisible structural watermark for images",
            "homepage": "https://github.com/Xuepoo/sigil",
            "license": "Apache-2.0",
            "architecture": {
              "64bit": {
                "url": "https://github.com/Xuepoo/sigil/releases/download/${VERSION}/sigil-windows-x86_64.exe.zip",
                "hash": "${SHA_WIN}"
              }
            },
            "bin": "sigil-windows-x86_64.exe",
            "checkver": {
              "github": "https://github.com/Xuepoo/sigil"
            }
          }
          EOF

          cd scoop-bucket
          git config user.name "Xuepoo (CI)"
          git config user.email "xuepoofoter@gmail.com"
          git add bucket/sigil.json
          git commit -m "Update Sigil to ${CLEAN_VERSION}" || true
          git push origin main
