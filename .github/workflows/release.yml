name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build Binary for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: capglyph-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: capglyph-linux-x86_64
            arch: amd64
            os_name: linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: capglyph-linux-aarch64
            arch: arm64
            os_name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: capglyph-windows-x86_64.exe
            os_name: windows
          - os: macos-26-intel
            target: x86_64-apple-darwin
            artifact_name: capglyph-macos-x86_64
            os_name: macos
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: capglyph-macos-aarch64
            os_name: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          path: capglyph-cli

      # CapGlyph depends on vectomancy crates + capglyph-core via path deps (../vectomancy, ../capglyph-core).
      - name: Checkout vectomancy (path dependency)
        uses: actions/checkout@v7.0.1
        with:
          repository: Xuepoo/vectomancy
          path: vectomancy

      - name: Checkout capglyph-core (path dependency, CTX-0040)
        uses: actions/checkout@v7.0.1
        with:
          repository: CapGlyph/capglyph-core
          path: capglyph-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            capglyph-cli/target
            capglyph-core/target
            vectomancy/target
          key: release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('capglyph-cli/Cargo.lock', 'capglyph-core/Cargo.lock', 'vectomancy/Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-${{ matrix.target }}-

      - name: Build release (learned+c2pa features)
        run: cargo build --release --features learned,c2pa --target ${{ matrix.target }}

      - name: Rename artifact (Linux/macOS)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: mv "target/${{ matrix.target }}/release/capglyph" "${{ matrix.artifact_name }}"

      - name: Rename artifact (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        run: move "target/${{ matrix.target }}/release/capglyph.exe" "${{ matrix.artifact_name }}"

      - name: Package tarball (Linux/macOS)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

      - name: Package zip (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        run: powershell Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Package for Linux distributions (nfpm)
        if: matrix.os_name == 'linux'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            NFPM_ARCH="arm64"
            PKG_ARCH="aarch64"
          else
            NFPM_ARCH="x86_64"
            PKG_ARCH="x86_64"
          fi
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.37.1/nfpm_2.37.1_Linux_${NFPM_ARCH}.tar.gz | tar xz nfpm
          sed -i "s/amd64/${NFPM_ARCH}/g" nfpm.yaml
          sed -i "s/capglyph-linux-x86_64/${{ matrix.artifact_name }}/g" nfpm.yaml
          ./nfpm pkg --packager deb --target capglyph-linux-${PKG_ARCH}.deb
          ./nfpm pkg --packager rpm --target capglyph-linux-${PKG_ARCH}.rpm
          ./nfpm pkg --packager archlinux --target capglyph-linux-${PKG_ARCH}.pkg.tar.zst

      - name: Upload artifact
        # v5 runs on the Node24 runtime; v4.x still declares node20 and
        # triggers the deprecation warning.
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            capglyph-cli/${{ matrix.artifact_name }}.tar.gz
            capglyph-cli/${{ matrix.artifact_name }}.zip
            capglyph-cli/*.deb
            capglyph-cli/*.rpm
            capglyph-cli/*.pkg.tar.zst

  release-github:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-aur:
    name: Publish to AUR
    needs: release-github
    # AUR credentials and its source-package dependency snapshots are external
    # distribution concerns. Their failure is visible in this job, but must not
    # invalidate an already-created GitHub Release.
    continue-on-error: true
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm git openssh pacman-contrib sudo fakeroot binutils make gcc pkgconf

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          mkdir -p /root/.ssh
          cp -r ~/.ssh/* /root/.ssh/
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/*

      - name: Configure Git
        run: |
          git config --system --add safe.directory '*'
          git config --global user.name "Xuepoo (CI)"
          git config --global user.email "xuepoofoter@gmail.com"

      - name: Update AUR source package (capglyph, formerly sigil-wm)
        run: |
          git clone ssh://aur@aur.archlinux.org/capglyph.git aur-src
          cd aur-src
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}

          # Bootstrap the PKGBUILD if the AUR repo is still empty (first
          # release). Later runs only bump the version.
          if [ ! -f PKGBUILD ]; then
            cat << PKGEOF > PKGBUILD
          # Maintainer: Xuepoo (CI) <xuepoofoter@gmail.com>
          pkgname=capglyph
          pkgver=${CLEAN_VERSION}
          pkgrel=1
          pkgdesc="Invisible structural watermark for images"
          arch=('x86_64' 'aarch64')
          url="https://github.com/CapGlyph/capglyph-cli"
          license=('Apache-2.0')
          _vmver=8.0.0
           source=("capglyph-\$pkgver::https://github.com/CapGlyph/capglyph-cli/archive/refs/tags/v\$pkgver.tar.gz"
                   "capglyph-core-\$pkgver::https://github.com/CapGlyph/capglyph-core/archive/refs/tags/v\$pkgver.tar.gz"
                   "vectomancy-\$_vmver::https://github.com/Xuepoo/vectomancy/archive/refs/tags/v\$_vmver.tar.gz")
           sha256sums=('SKIP'
                       'SKIP'
                       'SKIP')
           makedepends=('cargo')

           prepare() {
             # capglyph's Cargo.toml depends on ../vectomancy + ../capglyph-core path deps (CTX-0040)
             ln -sfn "\$srcdir/vectomancy-\$_vmver" "\$srcdir/capglyph-\$pkgver/../vectomancy"
             ln -sfn "\$srcdir/capglyph-core-\$pkgver" "\$srcdir/capglyph-\$pkgver/../capglyph-core"
           }

          build() {
            cd "capglyph-\$pkgver"
            cargo build --release --locked --features learned,c2pa
          }

          package() {
            cd "capglyph-\$pkgver"
            install -Dm755 "target/release/capglyph" "\$pkgdir/usr/bin/capglyph"
            ln -sf capglyph "\$pkgdir/usr/bin/sigil"
          }
          PKGEOF
          else
            sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push origin master

      - name: Update AUR binary package (capglyph-bin, formerly sigil-wm-bin)
        run: |
          git clone ssh://aur@aur.archlinux.org/capglyph-bin.git aur-bin
          cd aur-bin
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}

          if [ ! -f PKGBUILD ]; then
            cat << PKGEOF > PKGBUILD
          # Maintainer: Xuepoo (CI) <xuepoofoter@gmail.com>
          pkgname=capglyph-bin
          pkgver=${CLEAN_VERSION}
          pkgrel=1
          pkgdesc="Invisible structural watermark for images (binary release)"
          arch=('x86_64' 'aarch64')
          url="https://github.com/CapGlyph/capglyph-cli"
          license=('Apache-2.0')
          _arch="x86_64"
          [ "\$CARCH" = "aarch64" ] && _arch="aarch64"
          source=("capglyph-\$pkgver::https://github.com/CapGlyph/capglyph-cli/releases/download/v\$pkgver/capglyph-linux-\${_arch}.tar.gz")
          sha256sums=('SKIP')

          package() {
            install -Dm755 "capglyph" "\$pkgdir/usr/bin/capglyph"
            ln -sf capglyph "\$pkgdir/usr/bin/sigil"
          }
          PKGEOF
          else
            sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push origin master

  sync-brew:
    name: Sync Brew Formula
    needs: release-github
    # The GitHub Release remains authoritative when the external tap is absent
    # or its token lacks permission. The failed job remains visible to maintainers.
    continue-on-error: true
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v7.0.1
        with:
          repository: CapGlyph/homebrew-tap
          token: ${{ secrets.GH_PAT }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${VERSION#v}
          curl -sL -O "https://github.com/CapGlyph/capglyph-cli/releases/download/${VERSION}/capglyph-macos-x86_64.tar.gz"
          curl -sL -O "https://github.com/CapGlyph/capglyph-cli/releases/download/${VERSION}/capglyph-macos-aarch64.tar.gz"
          SHA_INTEL=$(sha256sum capglyph-macos-x86_64.tar.gz | awk '{print $1}')
          SHA_ARM=$(sha256sum capglyph-macos-aarch64.tar.gz | awk '{print $1}')

          mkdir -p homebrew-tap/Formula
          cat << EOF > homebrew-tap/Formula/capglyph.rb
          class Capglyph < Formula
            desc "Invisible structural watermark for images"
            homepage "https://github.com/CapGlyph/capglyph-cli"
            version "${CLEAN_VERSION}"
            license "Apache-2.0"

            if OS.mac? && Hardware::CPU.intel?
              url "https://github.com/CapGlyph/capglyph-cli/releases/download/${VERSION}/capglyph-macos-x86_64.tar.gz"
              sha256 "${SHA_INTEL}"
            elsif OS.mac? && Hardware::CPU.arm?
              url "https://github.com/CapGlyph/capglyph-cli/releases/download/${VERSION}/capglyph-macos-aarch64.tar.gz"
              sha256 "${SHA_ARM}"
            end

            def install
              bin.install "capglyph"
              # keep sigil alias for compatibility
              bin.install_symlink bin/"capglyph" => "sigil"
            end

            test do
              system "#{bin}/capglyph", "--version"
            end
          end
          EOF

          cd homebrew-tap
          git config user.name "Xuepoo (CI)"
          git config user.email "xuepoofoter@gmail.com"
          git add Formula/capglyph.rb
          git commit -m "Update CapGlyph to ${CLEAN_VERSION}" || true
          git push origin main

  sync-scoop:
    name: Sync Scoop Manifest
    needs: release-github
    # The GitHub Release remains authoritative when the external bucket is absent
    # or its token lacks permission. The failed job remains visible to maintainers.
    continue-on-error: true
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout scoop repository
        uses: actions/checkout@v7.0.1
        with:
          repository: CapGlyph/scoop-bucket
          token: ${{ secrets.GH_PAT }}
          path: scoop-bucket

      - name: Update Manifest
        run: |
          VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${VERSION#v}
          curl -sL -O "https://github.com/CapGlyph/capglyph-cli/releases/download/${VERSION}/capglyph-windows-x86_64.exe.zip"
          SHA_WIN=$(sha256sum capglyph-windows-x86_64.exe.zip | awk '{print $1}')

          mkdir -p scoop-bucket/bucket
          cat << EOF > scoop-bucket/bucket/capglyph.json
          {
            "version": "${CLEAN_VERSION}",
            "description": "Invisible structural watermark for images",
            "homepage": "https://github.com/CapGlyph/capglyph-cli",
            "license": "Apache-2.0",
            "architecture": {
              "64bit": {
                "url": "https://github.com/CapGlyph/capglyph-cli/releases/download/${VERSION}/capglyph-windows-x86_64.exe.zip",
                "hash": "${SHA_WIN}"
              }
            },
            "bin": "capglyph-windows-x86_64.exe",
            "checkver": {
              "github": "https://github.com/CapGlyph/capglyph-cli"
            }
          }
          EOF

          cd scoop-bucket
          git config user.name "Xuepoo (CI)"
          git config user.email "xuepoofoter@gmail.com"
          git add bucket/capglyph.json
          git commit -m "Update CapGlyph to ${CLEAN_VERSION}" || true
          git push origin main

  publish-crates:
    name: Publish Rust crates to crates.io
    needs: release-github
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout CLI tag
        uses: actions/checkout@v7.0.1
        with:
          path: capglyph-cli

      - name: Check capglyph-core registry version
        id: core-registry
        shell: bash
        run: |
          core_dep_version=$(grep -m1 'capglyph-core =' capglyph-cli/Cargo.toml | sed -n 's/.*version *= *"\([^"]*\)".*/\1/p')
          if curl --fail --silent --show-error --retry 3 \
            "https://crates.io/api/v1/crates/capglyph-core/$core_dep_version" >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping crates.io publication because capglyph-core $core_dep_version is not on crates.io. Publish capglyph-core first."
          fi

      - name: Install Rust toolchain
        if: steps.core-registry.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag and package versions
        if: steps.core-registry.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          cli_version=$(grep -m1 '^version = ' capglyph-cli/Cargo.toml | cut -d'"' -f2)
          server_version=$(grep -m1 '^version = ' capglyph-cli/crates/capglyph-server/Cargo.toml | cut -d'"' -f2)
          test "$cli_version" = "$expected_version"
          test "$server_version" = "$expected_version"

      - name: Wait for capglyph-core registry visibility
        if: steps.core-registry.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          core_dep_version=$(grep -m1 'capglyph-core =' capglyph-cli/Cargo.toml | sed -n 's/.*version *= *"\([^"]*\)".*/\1/p')
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://crates.io/api/v1/crates/capglyph-core/$core_dep_version" >/dev/null; then
              exit 0
            fi
            echo "Waiting for crates.io visibility (attempt $attempt/30) for capglyph-core $core_dep_version."
            sleep 10
          done
          echo "::error::capglyph-core $core_dep_version did not become visible on crates.io."
          exit 1

      - name: Verify and publish capglyph-server
        if: steps.core-registry.outputs.ready == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl --fail --silent --show-error --retry 3 \
            "https://crates.io/api/v1/crates/capglyph-server/$version" >/dev/null; then
            echo "::notice::capglyph-server $version is already present on crates.io; skipping publication."
          else
            (cd capglyph-cli && cargo publish -p capglyph-server --dry-run)
            (cd capglyph-cli && cargo publish -p capglyph-server --locked)
          fi

      - name: Verify and publish capglyph
        if: steps.core-registry.outputs.ready == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl --fail --silent --show-error --retry 3 \
            "https://crates.io/api/v1/crates/capglyph/$version" >/dev/null; then
            echo "::notice::capglyph $version is already present on crates.io; skipping publication."
          else
            (cd capglyph-cli && cargo publish -p capglyph --dry-run)
            (cd capglyph-cli && cargo publish -p capglyph --locked)
          fi
