schema_version = 1

[project]
id = "01M0094ARQJD79NQ9M0P1YSWPZ"
name = "sigil"
task_prefix = "CTX"

[git]
main_branch = "main"
branch_template = "ctx-{task_id}/{slug}"

[session]
stale_after = "2h"
single_active_session_per_agent = true

[task]
single_active_task_per_agent = true
strict_completion = false

[context]
default_mode = "compact"
max_events = 10
lookback = "7d"
include_git_status = true

[checkpoint]
require_before_session_end = true
capture_diff_stats = true
capture_untracked_files = true

[output]
color = "auto"
unicode = true
verbose = false

[output.fields]

[agent]

[verification]
commands = []
