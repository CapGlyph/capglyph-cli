[package]
name = "capglyph"
version = "0.1.6"
edition = "2021"
description = "Invisible structural watermark for images — human-invisible, machine-detectable"
license = "Apache-2.0"
repository = "https://github.com/CapGlyph/capglyph-cli"
keywords = ["watermark", "forensics", "image", "security", "tracing"]
categories = ["command-line-utilities", "multimedia::images"]
readme = "README.md"

[workspace]
members = ["crates/capglyph-server"]
resolver = "2"

[lib]
name = "capglyph"
path = "src/lib.rs"

[[bin]]
name = "capglyph"
path = "src/main.rs"

[dependencies]
# capglyph-core is now a standalone repo (CTX-0040). Isolated monorepo layout
# keeps it at ../capglyph-core sibling (local: /capglyph/capglyph-core).
# CI checks out CapGlyph/capglyph-core alongside capglyph-cli and vectomancy
# so this sibling path resolves. The version requirement is retained by
# `cargo publish`, so the packaged crate resolves capglyph-core from crates.io.
capglyph-core = { path = "../capglyph-core", version = "0.1.0" }

# Image I/O
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Vectomancy geometry/raster pipeline (path-based).
# NOTE: the `vectomancy` facade is intentionally NOT a dependency — capglyph only
# uses vectomancy-raster + vectomancy-geometry, and the facade pulls tera/zip/
# flate2/rand into the wasm graph for nothing.
# Isolated layout: `capglyph-cli` expects `../vectomancy` sibling (CI: `sigil` + `vectomancy`
# siblings; local: symlink `/capglyph/vectomancy -> /vectomancy/vectomancy`).
vectomancy-raster = { path = "../vectomancy/crates/vectomancy-raster", version = "8.1.0" }
vectomancy-geometry = { path = "../vectomancy/crates/vectomancy-geometry", version = "8.1.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
serde_bytes = "0.11"

# Error handling
anyhow = "1"

# Software 2D rasterizer with anti-aliasing (sub-pixel coverage → alpha signal)
tiny-skia = "0.11"

# Logging
tracing = "0.1"

sha2 = "0.11.0"
hmac = "0.13.0"
digest = "0.11.3"
chacha20poly1305 = "0.11"
aead = "0.6"
base64 = "0.22"
hex = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }

# Learned watermark (TrustMark ONNX, optional — pulls in ONNX Runtime)
trustmark = { version = "0.2", optional = true }
directories = { version = "6.0.0", optional = true }
ureq = { version = "3.4.0", optional = true }

# C2PA content credentials (optional — pure-Rust crypto backend, no OpenSSL)
c2pa = { version = "0.90", default-features = false, features = ["rust_native_crypto", "file_io"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"], optional = true }
x509-parser = { version = "0.18", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }

# CLI and batch helpers are used only by the CLI binary and batch
# module, which are never built for wasm. Target-gating removes them
# from the wasm dependency graph entirely (gating usage alone would
# leave them in `cargo tree --target wasm32-unknown-unknown`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
capglyph-server = { path = "crates/capglyph-server", version = "0.1.6" }
rand = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }

[features]
default = []
learned = ["dep:trustmark", "dep:directories", "dep:ureq"]
c2pa = ["dep:c2pa", "dep:rcgen", "dep:x509-parser", "dep:time"]

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
tempfile = "3.27.0"
