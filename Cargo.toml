[package]
name = "sigil"
version = "0.1.0"
edition = "2021"
description = "Invisible structural watermark for images — human-invisible, machine-detectable"
license = "Apache-2.0"
repository = "https://github.com/Xuepoo/sigil"
keywords = ["watermark", "forensics", "image", "security", "tracing"]
categories = ["command-line-utilities", "multimedia::images"]
readme = "README.md"

[lib]
name = "sigil"
path = "src/lib.rs"

[[bin]]
name = "sigil"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Image I/O
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Vectomancy geometry/raster pipeline (path-based)
vectomancy = { path = "../vectomancy", default-features = false }
vectomancy-raster = { path = "../vectomancy/crates/vectomancy-raster" }
vectomancy-geometry = { path = "../vectomancy/crates/vectomancy-geometry" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Software 2D rasterizer with anti-aliasing (sub-pixel coverage → alpha signal)
tiny-skia = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Glob pattern matching for batch operations
glob = "0.3"
sha2 = "0.11.0"
hmac = "0.13.0"
digest = "0.11.3"

# Learned watermark (TrustMark ONNX, optional — pulls in ONNX Runtime)
trustmark = { version = "0.2", optional = true }
directories = "6.0.0"
ureq = "3.4.0"

[features]
default = []
learned = ["dep:trustmark"]

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
tempfile = "3.27.0"
