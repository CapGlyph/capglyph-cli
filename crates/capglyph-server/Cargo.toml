[package]
name = "capglyph-server"
version = "0.1.2"
edition = "2021"
description = "CapGlyph credential server (sigild) — DB + atomic consume + revocation/audit"
license = "Apache-2.0"
repository = "https://github.com/CapGlyph/capglyph-cli"

[dependencies]
capglyph-core = { path = "../../../capglyph-core", version = "0.1.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
base64 = "0.22"
ciborium = "0.2"
serde_bytes = "0.11"
thiserror = "2"
tempfile = "3.27.0"
chacha20poly1305 = "0.11"
aead = "0.6"

axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace"] }

[[bin]]
name = "capglyphd"
path = "src/bin/capglyphd.rs"

[features]
default = []

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
