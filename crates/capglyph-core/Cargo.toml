[package]
name = "capglyph-core"
version = "0.1.0"
edition = "2021"
description = "Core codec and carrier primitives for capglyph (shared with capglyph-wasm and capglyphd)"
license = "Apache-2.0"
repository = "https://github.com/CapGlyph/capglyph-core"
keywords = ["watermark", "forensics", "image", "security", "tracing"]
categories = ["multimedia::images", "cryptography"]
readme = "README.md"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
serde_bytes = "0.11"
sha2 = "0.11.0"
hmac = "0.13.0"
digest = "0.11.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
